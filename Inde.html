<button onclick="loadPosts()">Load posts</button>
<input id="limit" type="number" value="5">
<ul id="posts"></ul>

<script>
async function loadPosts() {
  const posts = document.getElementById("posts");
  try {
    const input=document.getElementById("limit");
    const limit=input.value;
    if (limit === "" || Number(limit) < 1 || Number(limit) > 100) {
  posts.innerHTML = "<li>Enter a number from 1 to 100</li>";
  return;
    }
    posts.innerHTML = "<li>Loading...</li>";
    const response = await fetch(`https://jsonplaceholder.typicode.com/posts?_limit=${limit}`);
    if (!response.ok) {
      posts.innerHTML=`<li>Post not found</li>`;
      return;
    }
    const data = await response.json();
    const html = data.map(d=>`<li><strong>${d.title}</strong><br>${d.body}</li>`).join("")
     posts.innerHTML = html;
  } catch (error) {
    posts.innerHTML= `<li>Network error</li>`
  }
}
  </script>
